name: Deploy

# 自サーバーへの移行に伴い、旧サーバー（intohay 環境）への自動デプロイは停止中。
# push トリガーを外し、手動実行（workflow_dispatch）のみに変更している。
# 自分のサーバー向けにデプロイを再開する場合は、下記 host/username/key の
# Secrets とデプロイ先パスを自分の環境に差し替えたうえで再設定すること。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: チェックアウトリポジトリ
      uses: actions/checkout@v4

    - name: セットアップPython
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: 依存関係をインストール
      run: |
        python -m venv .venv
        source .venv/bin/activate
        .venv/bin/pip install --upgrade pip setuptools wheel
        .venv/bin/pip install .

    - name: テストを実行
      run: |
        source .venv/bin/activate
        PYTHONPATH=src .venv/bin/python -m unittest discover tests

    - name: デプロイ
      if: success() 
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SAKURA_SERVER_HOST }}
        username: ${{ secrets.SAKURA_SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/hiyolabbot
          git pull origin main
          python3 -m venv .venv || true

          ./.venv/bin/pip install --upgrade pip setuptools wheel
          ./.venv/bin/pip install .

          # Playwrightのシステム依存関係をインストール
          sudo ./.venv/bin/playwright install-deps chromium

          # Playwrightのブラウザをインストール
          ./.venv/bin/playwright install chromium

          ./.venv/bin/pip list | grep tweepy

          sudo systemctl daemon-reload
          sudo systemctl restart hiyolabbot.service